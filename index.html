  { id: 'vault', name: 'Złoty Sejf Bankowy', reqPrestige: 2, c1: '#7e6014', c2: '#3a2b07', border: '#ffd740', line: 'rgba(255,215,64,0.28)' },

  { id: 'space', name: 'Kosmiczna Pustka', reqPrestige: 4, c1: '#23113a', c2: '#090314', border: '#d500f9', line: 'rgba(213,0,249,0.25)' }
];
function fmt(n) {
  if (n < 1000) return Math.floor(n).toString();
  const suffixes = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
  const tier = Math.floor(Math.log10(Math.abs(n)) / 3);
  if (tier === 0) return Math.floor(n).toString();
  const suffix = suffixes[tier] || `e${tier * 3}`;
  const scaled = n / Math.pow(10, tier * 3);
  return scaled.toFixed(scaled >= 100 ? 0 : (scaled >= 10 ? 1 : 2)) + suffix;
}

let settings = { sound: true, vibration: true, forceLandscape: false };
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  if (!settings.sound) return;
  try {
    initAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    if (type === 'hit' || type === 'bat') {
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = type === 'bat' ? 'triangle' : 'sine';
      osc.frequency.setValueAtTime(type === 'bat' ? 190 : 130, now);
      osc.frequency.exponentialRampToValueAtTime(38, now + 0.11);
      gain.gain.setValueAtTime(0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.11);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.11);
    } else if (type === 'saw') {
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(95 + Math.random() * 35, now);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.08);
    } else if (type === 'gun' || type === 'explosion') {
      const dur = type === 'explosion' ? 0.38 : 0.14;
      const bufSize = audioCtx.sampleRate * dur;
      const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * (type === 'explosion' ? 0.12 : 0.04)));
      const noise = audioCtx.createBufferSource(); noise.buffer = buf;
      const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass';
      filter.frequency.setValueAtTime(type === 'explosion' ? 480 : 1400, now);
      const gain = audioCtx.createGain(); gain.gain.setValueAtTime(type === 'explosion' ? 0.5 : 0.3, now);
      noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
      noise.start(now);
    } else if (type === 'laser') {
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(720, now);
      osc.frequency.exponentialRampToValueAtTime(220, now + 0.07);
      gain.gain.setValueAtTime(0.14, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.07);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.07);
    } else if (type === 'freeze') {
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(900, now);
      osc.frequency.linearRampToValueAtTime(1600, now + 0.18);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.18);
    } else if (type === 'coin' || type === 'quest') {
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(type === 'quest' ? 587 : 880, now);
      osc.frequency.setValueAtTime(type === 'quest' ? 880 : 1320, now + 0.06);
      gain.gain.setValueAtTime(0.22, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.18);
    }
  } catch (e) {}
}

function vibrate(pattern) {
  if (!settings.vibration) return;
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
}

function resize() {
  if (settings.forceLandscape) {
    width = canvas.width = window.innerHeight;
    height = canvas.height = window.innerWidth;
  } else {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  const hint = document.getElementById('portrait-hint');
  hint.style.display = (window.innerHeight > window.innerWidth && !settings.forceLandscape) ? 'flex' : 'none';
}
window.addEventListener('resize', resize);

function loadSave() {
  try {
    const m = localStorage.getItem('ktb_money'); if (m !== null) money = parseFloat(m) || 0;
    const u = localStorage.getItem('ktb_unlocked'); if (u) unlocked = JSON.parse(u);
    if (!unlocked.includes('hand')) unlocked.unshift('hand');
    const wl = localStorage.getItem('ktb_wlevels'); if (wl) Object.assign(weaponLevels, JSON.parse(wl));
    const sk = localStorage.getItem('ktb_skins'); if (sk) unlockedSkins = JSON.parse(sk);
    const csk = localStorage.getItem('ktb_cur_skin'); if (csk && unlockedSkins.includes(csk)) currentSkin = csk;
    const pr = localStorage.getItem('ktb_prestige'); if (pr !== null) prestigeLevel = parseInt(pr, 10) || 0;
    const th = localStorage.getItem('ktb_theme'); if (th) currentTheme = th;
    const st = localStorage.getItem('ktb_settings'); if (st) Object.assign(settings, JSON.parse(st));
  } catch (e) {}
  applySettingsUI(); generateQuest(); updateHUD(); renderBottomBar();
}

function saveGame() {
  try {
    localStorage.setItem('ktb_money', money);
    localStorage.setItem('ktb_unlocked', JSON.stringify(unlocked));
    localStorage.setItem('ktb_wlevels', JSON.stringify(weaponLevels));
    localStorage.setItem('ktb_skins', JSON.stringify(unlockedSkins));
    localStorage.setItem('ktb_cur_skin', currentSkin);
    localStorage.setItem('ktb_prestige', prestigeLevel);
    localStorage.setItem('ktb_theme', currentTheme);
    localStorage.setItem('ktb_settings', JSON.stringify(settings));
  } catch (e) {}
}

function hardReset() {
  if (!confirm('Zresetować cały postęp, kasę i Prestige do zera?')) return;
  localStorage.clear();
  money = 0; unlocked = ['hand']; WEAPONS.forEach(w => { weaponLevels[w.id] = 1; });
  unlockedSkins = ['classic']; currentSkin = 'classic'; prestigeLevel = 0; currentTheme = 'box'; currentWeapon = 'hand';
  saveGame(); toggleSettings(); updateHUD(); renderBottomBar(); resetDummy();
}

function getSkinMult() { const s = SKINS.find(x => x.id === currentSkin); return s ? s.mult : 1.0; }
function getPrestigeMult() { return Math.pow(3, prestigeLevel); }
function getTotalMultiplier() {
  let m = getSkinMult() * getPrestigeMult();
  if (goldRushTimer > 0) m *= 2;
  if (combo > 1) m *= (1 + Math.min(combo, 100) * 0.04);
  return m;
}
function getWeaponLevel(id) { return weaponLevels[id] || 1; }
function getWeaponUpgradeCost(w) { return Math.round(w.upgBase * Math.pow(1.52, getWeaponLevel(w.id) - 1)); }
function getWeaponReward(w) { return Math.max(1, Math.round(w.reward * Math.pow(1.34, getWeaponLevel(w.id) - 1) * getTotalMultiplier())); }
function getBestUnlockedBaseReward() {
  let best = 2;
  WEAPONS.forEach(w => { if (unlocked.includes(w.id)) { const r = getWeaponReward(w); if (r > best) best = r; } });
  return best;
}

function addMoney(amount, x, y, customLabel = '') {
  money += amount; updateHUD(); saveGame();
  if (x !== undefined && y !== undefined) {
    floatingTexts.push({
      x: x + (Math.random() - 0.5) * 34, y: y - 12,
      text: customLabel ? `${customLabel} +$${fmt(amount)}` : `+$${fmt(amount)}`,
      vy: -2.4, life: 1.0,
      color: customLabel ? '#ffd740' : (goldRushTimer > 0 ? '#ffee58' : '#69f0ae'),
      scale: customLabel ? 1.35 : 1.05
    });
  }
}

function updateHUD() {
  document.getElementById('money-display').textContent = `$${fmt(money)}`;
  const sm = document.getElementById('shop-money'); if (sm) sm.textContent = `$${fmt(money)}`;
  const mult = getTotalMultiplier();
  document.getElementById('mult-display').textContent = `⚡ x${mult >= 100 ? fmt(mult) : mult.toFixed(1)}`;
  const w = WEAPONS.find(x => x.id === currentWeapon);
  if (w) {
    const lv = getWeaponLevel(w.id), cost = getWeaponUpgradeCost(w), btn = document.getElementById('quick-upgrade-btn');
    btn.textContent = `⬆️ ${w.icon} Lv.${lv + 1} ($${fmt(cost)})`;
    btn.style.opacity = money >= cost ? '1' : '0.6';
  }
}

function generateQuest() {
  const base = getBestUnlockedBaseReward();
  const types = [
    { type: 'hits', target: 20 + Math.floor(Math.random() * 20), mult: 18, label: t => `🎯 Misja: Traf kukłę ${t} razy` },
    { type: 'combo', target: 12 + Math.floor(Math.random() * 15), mult: 22, label: t => `🔥 Misja: Wbij Combo x${t}` },
    { type: 'upgrade', target: 1, mult: 25, label: () => `⬆️ Misja: Ulepsz dowolną broń` },
    { type: 'wall', target: 6, mult: 16, label: t => `💥 Misja: Uderz o ścianę ${t} razy` }
  ];
  const pick = types[Math.floor(Math.random() * types.length)];
  quest = { type: pick.type, target: pick.target, progress: 0, reward: Math.max(50, Math.round(base * pick.mult)), text: pick.label(pick.target) };
  updateQuestUI();
}

function advanceQuest(type, val = 1, isAbsolute = false) {
  if (quest.type !== type) return;
  quest.progress = isAbsolute ? Math.max(quest.progress, val) : quest.progress + val;
  if (quest.progress >= quest.target) {
    playSound('quest'); vibrate([30, 40, 60]);
    addMoney(quest.reward, width * 0.5, height * 0.3, '🎁 MISJA!');
    generateQuest();
  } else updateQuestUI();
}

function updateQuestUI() {
  document.getElementById('quest-text').textContent = `${quest.text} (${quest.progress}/${quest.target})`;
  document.getElementById('quest-reward').textContent = `+$${fmt(quest.reward)}`;
  document.getElementById('quest-fill').style.width = `${Math.min(100, Math.round((quest.progress / quest.target) * 100))}%`;
}

function renderBottomBar() {
  const bar = document.getElementById('bottom-bar'); bar.innerHTML = '';
  WEAPONS.forEach(w => {
    if (!unlocked.includes(w.id)) return;
    const lv = getWeaponLevel(w.id), btn = document.createElement('div');
    btn.className = 'weapon-slot' + (currentWeapon === w.id ? ' active' : '');
    btn.innerHTML = `<span>${w.icon}</span><span>${w.name}</span><span class="lv-tag">Lv.${lv}</span>`;
    btn.onclick = () => { currentWeapon = w.id; renderBottomBar(); updateHUD(); };
    bar.appendChild(btn);
  });
  updateHUD();
}

function upgradeCurrentWeapon() {
  const w = WEAPONS.find(x => x.id === currentWeapon); if (!w) return;
  const cost = getWeaponUpgradeCost(w);
  if (money >= cost) {
    money -= cost; weaponLevels[w.id] = getWeaponLevel(w.id) + 1;
    playSound('coin'); vibrate(25); advanceQuest('upgrade', 1); saveGame(); renderBottomBar();
    if (document.getElementById('shop-modal').classList.contains('open')) renderShopList();
  }
}

function toggleShop() {
  const modal = document.getElementById('shop-modal');
  modal.classList.toggle('open');
  if (modal.classList.contains('open')) renderShopList();
}

function switchCategory(cat, btn) {
  currentShopCat = cat;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active'); renderShopList();
}

function getPrestigeCost() { return 50000000 * Math.pow(25, prestigeLevel); }

function renderShopList() {
  const list = document.getElementById('shop-list'); list.innerHTML = '';
  if (currentShopCat === 'skins') {
    SKINS.forEach(s => {
      const isUnl = unlockedSkins.includes(s.id), isEq = currentSkin === s.id, canAff = money >= s.cost;
      const item = document.createElement('div'); item.className = 'shop-item' + (isUnl ? ' unlocked' : '');
      let btnClass = 'buy-btn' + (isUnl ? (isEq ? ' equipped' : ' select-mode') : (!canAff ? ' locked-poor' : ''));
      let btnText = isUnl ? (isEq ? 'Założono' : 'Załóż') : `Kup $${fmt(s.cost)}`;
      item.innerHTML = `<div class="item-info"><div class="item-icon">${s.icon}</div><div><div class="item-name">${s.name}</div><div class="item-desc">${s.desc}</div></div></div><button class="${btnClass}">${btnText}</button>`;
      item.querySelector('button').onclick = () => {
        if (isUnl) { currentSkin = s.id; playSound('coin'); saveGame(); updateHUD(); renderShopList(); }
        else if (money >= s.cost) { money -= s.cost; unlockedSkins.push(s.id); currentSkin = s.id; playSound('coin'); saveGame(); updateHUD(); renderShopList(); }
      };
      list.appendChild(item);
    });
    return;
  }
  if (currentShopCat === 'prestige') {
    const pCost = getPrestigeCost(), canP = money >= pCost, pCard = document.createElement('div');
    pCard.className = 'shop-item unlocked'; pCard.style.gridColumn = '1 / -1';
    pCard.innerHTML = `<div class="item-info"><div class="item-icon">🌟</div><div><div class="item-name">ODRODZENIE (PRESTIGE Lv.${prestigeLevel})</div><div class="item-desc">Resetuje kasę i bronie, ale daje STAŁY mnożnik x3 (Kolejny: x${fmt(Math.pow(3, prestigeLevel + 1))}) i nową arenę!</div><div class="item-reward">Koszt: $${fmt(pCost)}</div></div></div><button class="buy-btn ${canP ? 'upg-btn' : 'locked-poor'}">PRESTIGE ($${fmt(pCost)})</button>`;
    pCard.querySelector('button').onclick = () => {
      if (money < pCost || !confirm('Zresetować bronie i kasę za STAŁY mnożnik x3 i nową arenę?')) return;
      prestigeLevel++; money = 0; unlocked = ['hand']; WEAPONS.forEach(w => { weaponLevels[w.id] = 1; }); currentWeapon = 'hand';
      const newTheme = THEMES.find(t => t.reqPrestige === prestigeLevel); if (newTheme) currentTheme = newTheme.id;
      playSound('quest'); vibrate([50, 40, 90]); saveGame(); renderBottomBar(); renderShopList();
    };
    list.appendChild(pCard);
    THEMES.forEach(t => {
      const isUnl = prestigeLevel >= t.reqPrestige, isEq = currentTheme === t.id, item = document.createElement('div');
      item.className = 'shop-item' + (isUnl ? ' unlocked' : '');
      item.innerHTML = `<div class="item-info"><div class="item-icon" style="background:${t.c1};border:2px solid ${t.border};">🏟️</div><div><div class="item-name">${t.name}</div><div class="item-desc">${isUnl ? 'Arena odblokowana' : `Wymaga Prestige ${t.reqPrestige}`}</div></div></div><button class="buy-btn ${isUnl ? (isEq ? 'equipped' : 'select-mode') : 'locked-poor'}">${isUnl ? (isEq ? 'Aktywna' : 'Wybierz') : `Prestige ${t.reqPrestige}`}</button>`;
      item.querySelector('button').onclick = () => { if (isUnl) { currentTheme = t.id; saveGame(); renderShopList(); } };
      list.appendChild(item);
    });
    return;
  }
  WEAPONS.filter(w => w.cat === currentShopCat).forEach(w => {
    const isUnl = unlocked.includes(w.id), isEq = currentWeapon === w.id, canAff = money >= w.cost;
    const lv = getWeaponLevel(w.id), upgCost = getWeaponUpgradeCost(w), canUpg = money >= upgCost;
    const item = document.createElement('div'); item.className = 'shop-item' + (isUnl ? ' unlocked' : '');
    let btnClass = 'buy-btn' + (isUnl ? (isEq ? ' equipped' : ' select-mode') : (!canAff ? ' locked-poor' : ''));
    let btnText = isUnl ? (isEq ? 'Wybrano' : 'Wybierz') : `Kup $${fmt(w.cost)}`;
    item.innerHTML = `<div class="item-info"><div class="item-icon">${w.icon}</div><div><div class="item-name">${w.name} <span style="color:#ffd54f;font-size:11px;">Lv.${lv}</span></div><div class="item-desc">${w.desc}</div><div class="item-reward">Zarobek: +$${fmt(getWeaponReward(w))} / hit</div></div></div><div class="item-actions"><button class="${btnClass} act-main">${btnText}</button>${isUnl ? `<button class="buy-btn ${canUpg ? 'upg-btn' : 'locked-poor'} act-upg">⬆️ Lv.${lv + 1} ($${fmt(upgCost)})</button>` : ''}</div>`;
    item.querySelector('.act-main').onclick = () => {
      if (isUnl) { currentWeapon = w.id; renderBottomBar(); renderShopList(); }
      else if (money >= w.cost) { money -= w.cost; unlocked.push(w.id); currentWeapon = w.id; playSound('coin'); saveGame(); renderBottomBar(); renderShopList(); }
    };
    const upgBtn = item.querySelector('.act-upg');
    if (upgBtn) upgBtn.onclick = () => {
      if (money >= upgCost) { money -= upgCost; weaponLevels[w.id] = lv + 1; playSound('coin'); advanceQuest('upgrade', 1); saveGame(); renderBottomBar(); renderShopList(); }
    };
    list.appendChild(item);
  });
}

function toggleSettings() { document.getElementById('settings-modal').classList.toggle('open'); }
function toggleSetting(key) {
  settings[key] = !settings[key];
  if (key === 'sound' && settings.sound) playSound('coin');
  if (key === 'vibration' && settings.vibration) vibrate(40);
  applySettingsUI(); saveGame();
}
function toggleForceLandscape() { settings.forceLandscape = !settings.forceLandscape; applySettingsUI(); saveGame(); resize(); resetDummy(); }
function applySettingsUI() {
  const bSound = document.getElementById('btn-sound'); bSound.textContent = settings.sound ? 'ON' : 'OFF'; bSound.className = 'toggle-btn ' + (settings.sound ? 'toggle-on' : 'toggle-off');
  const bVib = document.getElementById('btn-vib'); bVib.textContent = settings.vibration ? 'ON' : 'OFF'; bVib.className = 'toggle-btn ' + (settings.vibration ? 'toggle-on' : 'toggle-off');
  const bRot = document.getElementById('btn-rot'); bRot.textContent = settings.forceLandscape ? 'ON' : 'OFF'; bRot.className = 'toggle-btn ' + (settings.forceLandscape ? 'toggle-on' : 'toggle-off');
  document.body.classList.toggle('force-landscape', settings.forceLandscape);

const gravity = 0.42, friction = 0.985, bounce = 0.58;
let points = [], sticks = [], dummy = {};
let particles = [], shockwaves = [], floatingTexts = [], tracers = [], bees = [], animals = [], blackHoles = [], lightnings = [], anvils = [], rockets = [];
let screenShake = 0, flashAlpha = 0, hurtTimer = 0, shockTimer = 0, burnTimer = 0, burnTick = 0, frozenTimer = 0;

function getBoxBounds() { return { left: 14, right: width - 14, top: 52, bottom: height - 58 }; }

class Point {
  constructor(x, y, r, name = '') { this.x = x; this.y = y; this.oldx = x; this.oldy = y; this.r = r; this.name = name; }
}
class Stick {
  constructor(p0, p1, len, thickness, role, visible = true) {
    this.p0 = p0; this.p1 = p1; this.len = len || Math.hypot(p1.x - p0.x, p1.y - p0.y);
    this.thickness = thickness; this.role = role; this.visible = visible;
  }
}

function initDummy() {
  points = []; sticks = [];
  const cx = width * 0.5, cy = height * 0.46;
  const head = new Point(cx, cy - 60, 26, 'head'), neck = new Point(cx, cy - 30, 8, 'neck');
  const chest = new Point(cx, cy - 5, 14, 'chest'), pelvis = new Point(cx, cy + 25, 13, 'pelvis');
  const lElbow = new Point(cx - 26, cy - 10, 8), lHand = new Point(cx - 46, cy + 10, 10);
  const rElbow = new Point(cx + 26, cy - 10, 8), rHand = new Point(cx + 46, cy + 10, 10);
  const lKnee = new Point(cx - 17, cy + 56, 9), lFoot = new Point(cx - 21, cy + 88, 11);
  const rKnee = new Point(cx + 17, cy + 56, 9), rFoot = new Point(cx + 21, cy + 88, 11);
  points.push(head, neck, chest, pelvis, lElbow, lHand, rElbow, rHand, lKnee, lFoot, rKnee, rFoot);
  sticks.push(
    new Stick(head, neck, 30, 12, 'skin'), new Stick(neck, chest, 25, 25, 'shirt'), new Stick(chest, pelvis, 30, 23, 'shirt'),
    new Stick(neck, lElbow, 30, 12, 'shirt'), new Stick(lElbow, lHand, 26, 10, 'skin'),
    new Stick(neck, rElbow, 30, 12, 'shirt'), new Stick(rElbow, rHand, 26, 10, 'skin'),
    new Stick(pelvis, lKnee, 34, 14, 'pants'), new Stick(lKnee, lFoot, 32, 12, 'skin'),
    new Stick(pelvis, rKnee, 34, 14, 'pants'), new Stick(rKnee, rFoot, 32, 12, 'skin'),
    new Stick(head, chest, 55, 0, '', false), new Stick(neck, pelvis, 55, 0, '', false),
    new Stick(head, pelvis, 85, 0, '', false), new Stick(lElbow, rElbow, 48, 0, '', false), new Stick(lKnee, rKnee, 32, 0, '', false)
  );
  dummy = { head, neck, chest, pelvis, lHand, rHand, lFoot, rFoot };
}

function resetDummy() {
  bees = []; animals = []; blackHoles = []; anvils = []; rockets = [];
  burnTimer = 0; shockTimer = 0; frozenTimer = 0; initDummy();
}

function addShockwave(x, y, maxR = 110, color = '#ffca28') { shockwaves.push({ x, y, r: 10, maxR, color, life: 1.0 }); }

function spawnStuffing(x, y, count = 12, speed = 8, customColor = null) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2, s = 1.5 + Math.random() * speed, t = Math.random();
    particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1.5, size: 3 + Math.random() * 4.5,
      color: customColor || (t < 0.45 ? '#f5e6cc' : (t < 0.8 ? '#ffab00' : '#ff1744')), life: 1.0
    });
  }
}

function applyForceToDummy(originX, originY, forceX, forceY, radius = 160) {
  points.forEach(p => {
    const d = Math.hypot(p.x - originX, p.y - originY);
    if (d < radius) {
      const factor = 1 - (d / radius) * 0.45;
      p.oldx -= forceX * factor; p.oldy -= forceY * factor;
    }
  });
}

function registerCombo() {
  combo++; comboTimer = 110;
  const box = document.getElementById('combo-box');
  if (combo >= 2) {
    box.style.display = 'block'; box.style.transform = 'scale(1.22)';
    setTimeout(() => { box.style.transform = 'scale(1)'; }, 80);
    document.getElementById('combo-num').textContent = `COMBO x${combo}`;
    document.getElementById('combo-sub').textContent = `Bonus kasy +${Math.min(combo, 100) * 4}%`;
    advanceQuest('combo', combo, true);
  }
}

function hitDummy(baseReward, x, y, fx, fy, shake = 7, soundType = 'hit') {
  registerCombo(); advanceQuest('hits', 1);
  let finalReward = baseReward, label = '';
  if (frozenTimer > 0 && soundType !== 'freeze') {
    frozenTimer = 0; finalReward *= 3; label = '❄️ KRUSZENIE x3!';
    addShockwave(x, y, 140, '#80deea'); spawnStuffing(x, y, 25, 13, '#80deea');
    playSound('explosion'); vibrate([35, 25, 55]);
  } else {
    playSound(soundType); vibrate(shake >= 12 ? [30, 20, 45] : 18);
  }
  hurtTimer = 45; screenShake = Math.max(screenShake, shake);
  addMoney(finalReward, x, y, label); spawnStuffing(x, y, 11, 8);
  applyForceToDummy(x, y, fx, fy, 175);
}

let pointer = { x: 0, y: 0, prevX: 0, prevY: 0, down: false, grabbed: null };
let holdTick = 0, batSwing = null, slamCooldown = 0;
function getWeaponData(id) { return WEAPONS.find(w => w.id === id); }

function getPointerPos(e) {
  const touch = e.touches && e.touches[0] ? e.touches[0] : (e.changedTouches && e.changedTouches[0] ? e.changedTouches[0] : e);
  if (settings.forceLandscape) return { x: touch.clientY, y: window.innerWidth - touch.clientX };
  return { x: touch.clientX, y: touch.clientY };
}

function onPointerDown(e) {
  if (e.target !== canvas) return;
  e.preventDefault(); initAudio();
  const pos = getPointerPos(e);
  pointer.x = pointer.prevX = pos.x; pointer.y = pointer.prevY = pos.y;
  pointer.down = true; holdTick = 0;
  const w = getWeaponData(currentWeapon), reward = getWeaponReward(w);

  if (pinata && Math.hypot(pos.x - pinata.x, pos.y - pinata.y) < 55) {
    pinata.hp--; playSound('coin'); vibrate(30);
    spawnStuffing(pinata.x, pinata.y, 14, 10, '#ffd740');
    const bonus = Math.round(getBestUnlockedBaseReward() * 4);
    addMoney(bonus, pinata.x, pinata.y, '🪅 PIÑATA!'); pinata.vy = -7;
    if (pinata.hp <= 0) {
      addShockwave(pinata.x, pinata.y, 160, '#ffd740');
      addMoney(bonus * 4, pinata.x, pinata.y, '🎉 ROZBITA!'); pinata = null;
    }
    return;
  }

  const cx = dummy.chest.x, cy = dummy.chest.y;
  if (currentWeapon === 'hand') {
    let closest = null, minD = 75;
    points.forEach(p => { const d = Math.hypot(p.x - pos.x, p.y - pos.y); if (d < minD) { minD = d; closest = p; } });
    if (closest) { pointer.grabbed = closest; hitDummy(reward, closest.x, closest.y, 0, -2, 3, 'hit'); }
  } else if (currentWeapon === 'bat') {
    batSwing = { x: pos.x, y: pos.y, timer: 12 };
    if (Math.hypot(cx - pos.x, cy - pos.y) < 145) hitDummy(reward, dummy.head.x, dummy.head.y, (pos.x < cx ? 1 : -1) * 19, -13, 9, 'bat');
  } else if (currentWeapon === 'anvil') {
    anvils.push({ x: dummy.head.x + (Math.random() - 0.5) * 20, y: getBoxBounds().top + 15, vy: 6, reward, hasHit: false, life: 75 });
  } else if (currentWeapon === 'pistol') {
    fireGun(pos.x, pos.y, 1, 0.04, reward, 16, 7);
  } else if (currentWeapon === 'shotgun') {
    fireGun(pos.x, pos.y, 6, 0.24, reward, 25, 14);
  } else if (currentWeapon === 'rpg') {
    const sx = width * 0.5, sy = height - 60, ang = Math.atan2(pos.y - sy, pos.x - sx);
    rockets.push({ x: sx, y: sy, vx: Math.cos(ang) * 18, vy: Math.sin(ang) * 18, reward }); playSound('gun');
  } else if (currentWeapon === 'bees') {
    spawnBeesBalanced(pos.x, pos.y, reward);
  } else if (currentWeapon === 'shark') {
    spawnAnimal('shark', '🦈', reward, 20, -7);
  } else if (currentWeapon === 'bull') {
    spawnAnimal('bull', '🐂', reward, 25, 0);
  } else if (currentWeapon === 'dragon') {
    spawnAnimal('dragon', '🐉', reward, 15, 0);
  } else if (currentWeapon === 'freeze') {
    castFreeze(reward);
  } else if (currentWeapon === 'lightning') {
    strikeLightning(reward);
  } else if (currentWeapon === 'blackhole') {
    spawnBlackHole(pos.x, pos.y, reward);
  }
}

function onPointerMove(e) {
  if (!pointer.down) return;
  e.preventDefault();
  const pos = getPointerPos(e);
  pointer.prevX = pointer.x; pointer.prevY = pointer.y; pointer.x = pos.x; pointer.y = pos.y;
  if (currentWeapon === 'bat') {
    const speed = Math.hypot(pointer.x - pointer.prevX, pointer.y - pointer.prevY);
    if (speed > 14 && Math.hypot(dummy.chest.x - pointer.x, dummy.chest.y - pointer.y) < 95) {
      const w = getWeaponData('bat');
      hitDummy(getWeaponReward(w), dummy.chest.x, dummy.chest.y, (pointer.x - pointer.prevX) * 0.9, (pointer.y - pointer.prevY) * 0.9, 8, 'bat');
    }
  }
}

function onPointerUp() { pointer.down = false; pointer.grabbed = null; }
canvas.addEventListener('mousedown', onPointerDown); window.addEventListener('mousemove', onPointerMove); window.addEventListener('mouseup', onPointerUp);
canvas.addEventListener('touchstart', onPointerDown, { passive: false }); window.addEventListener('touchmove', onPointerMove, { passive: false }); window.addEventListener('touchend', onPointerUp);

function fireGun(tx, ty, pellets, spread, reward, knockback, shake) {
  const startX = width * 0.5, startY = height - 60;
  let hitAny = false;

  lightnings.forEach(l => {
    ctx.strokeStyle = `rgba(128, 216, 255, ${l.life})`; ctx.lineWidth = 8;
    ctx.beginPath(); l.segments.forEach(s => { ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); }); ctx.stroke();
    ctx.strokeStyle = `rgba(255, 255, 255, ${l.life})`; ctx.lineWidth = 3; ctx.stroke();
  });
  ctx.font = '22px sans-serif'; bees.forEach(b => { ctx.fillText('🐝', b.x, b.y); });
  ctx.font = '62px sans-serif';
  animals.forEach(a => { ctx.save(); ctx.translate(a.x, a.y); if (a.dir > 0) ctx.scale(-1, 1); ctx.fillText(a.icon, 0, 0); ctx.restore(); });
  particles.forEach(pt => {
    ctx.globalAlpha = Math.max(0, pt.life); ctx.fillStyle = pt.color;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalAlpha = 1.0;
  floatingTexts.forEach(ft => {
    ctx.globalAlpha = Math.max(0, ft.life);
    ctx.font = `900 ${Math.round(18 * ft.scale)}px 'Segoe UI', sans-serif`; ctx.textAlign = 'center';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 4; ctx.strokeText(ft.text, ft.x, ft.y);
    ctx.fillStyle = ft.color; ctx.fillText(ft.text, ft.x, ft.y);
  });
  ctx.globalAlpha = 1.0;
  if (flashAlpha > 0) { ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`; ctx.fillRect(0, 0, width, height); }
}

function loop() {
  update();
  ctx.save();
  if (screenShake > 0.5) ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
  ctx.clearRect(-20, -20, width + 40, height + 40);
  drawArena(); drawDummy(); drawEffects();
  ctx.restore();
  requestAnimationFrame(loop);
}

loadSave(); resize(); initDummy(); loop();
</script>
</body>
</html>
