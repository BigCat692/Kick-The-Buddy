function fmt(n) {
  if (n < 1000) return Math.floor(n).toString();
  const suffixes = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
  const tier = Math.floor(Math.log10(Math.abs(n)) / 3);
  if (tier === 0) return Math.floor(n).toString();
  const suffix = suffixes[tier] || `e${tier * 3}`;
  const scaled = n / Math.pow(10, tier * 3);
  return scaled.toFixed(scaled >= 100 ? 0 : (scaled >= 10 ? 1 : 2)) + suffix;
}

let settings = { sound: true, vibration: true, forceLandscape: true };
let audioCtx = null;
function initAudio() {
  if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  if (!settings.sound) return;
  try {
    initAudio(); if (!audioCtx) return;
    const now = audioCtx.currentTime;
    if (type === 'hit' || type === 'bat') {
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = type === 'bat' ? 'triangle' : 'sine';
      osc.frequency.setValueAtTime(type === 'bat' ? 190 : 130, now);
      osc.frequency.exponentialRampToValueAtTime(36, now + 0.12);
      gain.gain.setValueAtTime(0.35, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
      osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.12);
    } else if (type === 'saw') {
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(95 + Math.random() * 35, now);
      gain.gain.setValueAtTime(0.18, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
      osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.08);
    } else if (type === 'gun' || type === 'explosion' || type === 'nuke') {
      const dur = type === 'nuke' ? 0.7 : (type === 'explosion' ? 0.4 : 0.14);
      const bufSize = audioCtx.sampleRate * dur, buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate), data = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * (dur * 0.35)));
      const noise = audioCtx.createBufferSource(); noise.buffer = buf;
      const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass';
      filter.frequency.setValueAtTime(type === 'nuke' ? 280 : (type === 'explosion' ? 480 : 1400), now);
      const gain = audioCtx.createGain(); gain.gain.setValueAtTime(type === 'nuke' ? 0.7 : (type === 'explosion' ? 0.5 : 0.3), now);
      noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination); noise.start(now);
    } else if (type === 'laser') {
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'square'; osc.frequency.setValueAtTime(720, now); osc.frequency.exponentialRampToValueAtTime(200, now + 0.08);
      gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
      osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.08);
    } else if (type === 'freeze') {
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(900, now); osc.frequency.linearRampToValueAtTime(1600, now + 0.18);
      gain.gain.setValueAtTime(0.25, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
      osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.18);
    } else if (type === 'coin' || type === 'quest') {
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(type === 'quest' ? 587 : 880, now);
      osc.frequency.setValueAtTime(type === 'quest' ? 880 : 1320, now + 0.06);
      gain.gain.setValueAtTime(0.22, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
      osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.18);
    }
  } catch (e) {}
}

function vibrate(pattern) {
  if (!settings.vibration) return;
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
}

function getSkinMult() { const s = SKINS.find(x => x.id === currentSkin); return s ? s.mult : 1.0; }
function getPrestigeMult() { return Math.pow(1.6, prestigeLevel); }
function getTotalMultiplier() {
  let m = getSkinMult() * getPrestigeMult();
  if (goldRushTimer > 0 || berserkTimer > 0) m *= 2;
  if (combo > 1) m *= (1 + Math.min(combo, 100) * 0.02);
  return m;
}
function getWeaponLevel(id) { return weaponLevels[id] || 1; }
function getWeaponUpgradeCost(w) { return Math.round(w.upgBase * Math.pow(1.6, getWeaponLevel(w.id) - 1)); }
function getWeaponReward(w) { return Math.max(1, Math.round(w.reward * Math.pow(1.22, getWeaponLevel(w.id) - 1) * getTotalMultiplier())); }
function getBestUnlockedBaseReward() {
  let best = 2;
  WEAPONS.forEach(w => { if (unlocked.includes(w.id)) { const r = getWeaponReward(w); if (r > best) best = r; } });
  return best;
}

function generateQuest() {
  const base = getBestUnlockedBaseReward();
  const types = [
    { type: 'hits', target: 30 + Math.floor(Math.random() * 30), mult: 12, label: t => `${t('quest')} Traf kukłę ${t}x` },
    { type: 'combo', target: 15 + Math.floor(Math.random() * 15), mult: 15, label: t => `${t('quest')} Wbij Combo x${t}` },
    { type: 'upgrade', target: 1, mult: 18, label: () => `${t('quest')} Ulepsz broń` },
    { type: 'wall', target: 10, mult: 14, label: t => `${t('quest')} Rzuć o ścianę ${t}x` }
  ];
  const pick = types[Math.floor(Math.random() * types.length)];
  quest = { type: pick.type, target: pick.target, progress: 0, reward: Math.max(30, Math.round(base * pick.mult)), text: pick.label(pick.target) };
  updateQuestUI();
}

function advanceQuest(type, val = 1, isAbsolute = false) {
  if (quest.type !== type) return;
  quest.progress = isAbsolute ? Math.max(quest.progress, val) : quest.progress + val;
  if (quest.progress >= quest.target) {
    playSound('quest'); vibrate([40, 30, 70]);
    addMoney(quest.reward, width * 0.5, height * 0.3, '🎁 MISJA!');
    generateQuest();
  } else updateQuestUI();
}

function updateQuestUI() {
  document.getElementById('quest-text').textContent = `${quest.text} (${quest.progress}/${quest.target})`;
  document.getElementById('quest-reward').textContent = `+$${fmt(quest.reward)}`;
  document.getElementById('quest-fill').style.width = `${Math.min(100, Math.round((quest.progress / quest.target) * 100))}%`;
}

      if (!av.hasHit) { av.hasHit = true; addShockwave(av.x, av.y, 110, '#cbd5e1'); hitDummy(av.reward, dummy.chest.x, dummy.chest.y, (Math.random() - 0.5) * 18, -14, 14, 'explosion', [130, 30, 60]); }
      av.life--; if (av.life <= 0) anvils.splice(i, 1);
    }
  }

  for (let i = rockets.length - 1; i >= 0; i--) {
    const rk = rockets[i]; rk.x += rk.vx; rk.y += rk.vy;
    particles.push({ x: rk.x, y: rk.y, vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2, size: 6, color: '#f97316', life: 0.5 });
    const outBounds = rk.x < bounds.left || rk.x > bounds.right || rk.y < bounds.top || rk.y > bounds.bottom;
    if (Math.hypot(rk.x - dummy.chest.x, rk.y - dummy.chest.y) < 65 || outBounds) {
      addShockwave(rk.x, rk.y, 180, '#f97316'); spawnStuffing(rk.x, rk.y, 28, 14, '#f97316');
      hitDummy(rk.reward, dummy.chest.x, dummy.chest.y, (Math.random() - 0.5) * 40, -26, 22, 'explosion', rk.vib);
      rockets.splice(i, 1);
    }
  }

  for (let i = blackHoles.length - 1; i >= 0; i--) {
    const bh = blackHoles[i]; bh.timer--; bh.angle += 0.25; bh.tick++;
    points.forEach(p => {
      const dx = bh.x - p.x, dy = bh.y - p.y, dist = Math.max(15, Math.hypot(dx, dy));
      p.oldx -= (dx / dist) * 3.4 - (dy / dist) * 2.3; p.oldy -= (dy / dist) * 3.4 + (dx / dist) * 2.3;
    });
    if (bh.tick % 20 === 0) {
      hurtTimer = 30; screenShake = 9; vibrate([45, 35, 65]);
      addMoney(Math.round(bh.reward * 0.2), bh.x, bh.y); spawnStuffing(bh.x, bh.y, 6, 9, '#c084fc');
    }
    if (bh.timer <= 0) {
      addShockwave(bh.x, bh.y, 210, '#c084fc');
      hitDummy(bh.reward, bh.x, bh.y, (Math.random() - 0.5) * 48, -32, 26, 'explosion', [200, 40, 260]);
      blackHoles.splice(i, 1);
    }
  }

  if (bees.length > 0) {
    beeStingTick++;
    for (let i = bees.length - 1; i >= 0; i--) {
      const b = bees[i]; b.timer--;
      const target = i % 2 === 0 ? dummy.head : dummy.chest, dx = target.x - b.x, dy = target.y - b.y;
      b.vx = b.vx * 0.85 + dx * 0.05 + (Math.random() - 0.5) * 5; b.vy = b.vy * 0.85 + dy * 0.05 + (Math.random() - 0.5) * 5;
      b.x += b.vx; b.y += b.vy;
      if (b.timer <= 0) bees.splice(i, 1);
    }
    if (beeStingTick % 12 === 0 && bees.length > 0) hitDummy(bees[0].reward, dummy.head.x, dummy.head.y, (Math.random() - 0.5) * 9, -4, 3, 'hit', [20, 15, 20]);
  }

  for (let i = animals.length - 1; i >= 0; i--) {
    const a = animals[i]; a.x += a.vx; a.y += a.vy; a.tick++;
    if (a.type === 'shark') a.vy += 0.25;
    if (!a.hasHit && Math.hypot(a.x - dummy.chest.x, a.y - dummy.chest.y) < 90) {
      a.hasHit = true; addShockwave(dummy.chest.x, dummy.chest.y, 150, '#fff');
      hitDummy(a.reward, dummy.chest.x, dummy.chest.y, a.dir * 34, -20, 20, 'explosion', a.vib);
    }
    if (a.x < -150 || a.x > width + 150) animals.splice(i, 1);
  }

  points.forEach(p => {
    if (p === pointer.grabbed) {
      const vx = (pointer.x - p.x) * 0.65, vy = (pointer.y - p.y) * 0.65;
      p.x = pointer.x; p.y = pointer.y; p.oldx = p.x - vx; p.oldy = p.y - vy; return;
    }
    const damp = frozenTimer > 0 ? 0.9 : friction;
    let vx = (p.x - p.oldx) * damp, vy = (p.y - p.oldy) * damp;
    if (shockTimer > 0) { vx += (Math.random() - 0.5) * 7; vy += (Math.random() - 0.5) * 7; }
    p.oldx = p.x; p.oldy = p.y; p.x += vx; p.y += vy + gravity;

    const speed = Math.hypot(vx, vy);
    let slammed = false;
    if (p.x < bounds.left + p.r) { p.x = bounds.left + p.r; p.oldx = p.x + vx * bounce; if (speed > 11) slammed = true; }
    else if (p.x > bounds.right - p.r) { p.x = bounds.right - p.r; p.oldx = p.x + vx * bounce; if (speed > 11) slammed = true; }
    if (p.y < bounds.top + p.r) { p.y = bounds.top + p.r; p.oldy = p.y + vy * bounce; if (speed > 11) slammed = true; }
    else if (p.y > bounds.bottom - p.r) { p.y = bounds.bottom - p.r; p.oldy = p.y + vy * bounce; p.oldx += vx * 0.15; if (speed > 12) slammed = true; }

    if (slammed && slamCooldown <= 0) {
      slamCooldown = 10; advanceQuest('wall', 1);
      hitDummy(getWeaponReward(getWeaponData('hand')), p.x, p.y, 0, 0, 6, 'hit', [35]);
    }
  });

  if (!pointer.grabbed && blackHoles.length === 0 && frozenTimer <= 0) { dummy.head.y -= 0.7; dummy.pelvis.y += 0.4; }

  for (let iter = 0; iter < 6; iter++) {
    sticks.forEach(s => {
      const dx = s.p1.x - s.p0.x, dy = s.p1.y - s.p0.y, dist = Math.hypot(dx, dy) || 0.001;
      const diff = (s.len - dist) / dist * 0.5, ox = dx * diff, oy = dy * diff;
      if (s.p0 !== pointer.grabbed) { s.p0.x -= ox; s.p0.y -= oy; }
      if (s.p1 !== pointer.grabbed) { s.p1.x += ox; s.p1.y += oy; }
    });
  }

  for (let i = shockwaves.length - 1; i >= 0; i--) { const sw = shockwaves[i]; sw.r += (sw.maxR - sw.r) * 0.22; sw.life -= 0.06; if (sw.life <= 0) shockwaves.splice(i, 1); }
  for (let i = beams.length - 1; i >= 0; i--) { beams[i].life -= 0.05; if (beams[i].life <= 0) beams.splice(i, 1); }
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i]; pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.18; pt.life -= 0.026;
    if (pt.y > bounds.bottom) { pt.y = bounds.bottom; pt.vy *= -0.3; pt.vx *= 0.7; }
    if (pt.life <= 0) particles.splice(i, 1);
  }
  for (let i = floatingTexts.length - 1; i >= 0; i--) { const ft = floatingTexts[i]; ft.y += ft.vy; ft.life -= 0.022; if (ft.life <= 0) floatingTexts.splice(i, 1); }
  for (let i = tracers.length - 1; i >= 0; i--) { tracers[i].life -= 0.15; if (tracers[i].life <= 0) tracers.splice(i, 1); }
  for (let i = lightnings.length - 1; i >= 0; i--) { lightnings[i].life -= 0.08; if (lightnings[i].life <= 0) lightnings.splice(i, 1); }
}

function drawArena() {
  const b = getBoxBounds(), theme = THEMES.find(t => t.id === currentTheme) || THEMES[0];
  const grad = ctx.createRadialGradient(width * 0.5, height * 0.45, 30, width * 0.5, height * 0.5, Math.max(width, height) * 0.7);
  grad.addColorStop(0, theme.c1); grad.addColorStop(1, theme.c2);
  ctx.fillStyle = grad; ctx.fillRect(b.left, b.top, b.right - b.left, b.bottom - b.top);
  ctx.strokeStyle = theme.line; ctx.lineWidth = 2.5;
  const padX = (b.right - b.left) * 0.11, padY = (b.bottom - b.top) * 0.13;
  ctx.strokeRect(b.left + padX, b.top + padY, (b.right - b.left) - padX * 2, (b.bottom - b.top) - padY * 2);
  ctx.beginPath();
  ctx.moveTo(b.left, b.top); ctx.lineTo(b.left + padX, b.top + padY);
  ctx.moveTo(b.right, b.top); ctx.lineTo(b.right - padX, b.top + padY);
  ctx.moveTo(b.left, b.bottom); ctx.lineTo(b.left + padX, b.bottom - padY);
  ctx.moveTo(b.right, b.bottom); ctx.lineTo(b.right - padX, b.bottom - padY);
  ctx.stroke();
  ctx.strokeStyle = goldRushTimer > 0 || berserkTimer > 0 ? '#facc15' : theme.border;
  ctx.lineWidth = goldRushTimer > 0 || berserkTimer > 0 ? 6 : 4;
  ctx.strokeRect(b.left, b.top, b.right - b.left, b.bottom - b.top);
}

function drawDummy() {
  const skin = SKINS.find(s => s.id === currentSkin) || SKINS[0];
  const b = getBoxBounds();
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(dummy.chest.x, b.bottom - 4, 38, 8, 0, 0, Math.PI * 2); ctx.fill();

  // Rysowanie czerwonych plam / śladów walki na kukle
  bloodSplats.forEach(bs => {
    ctx.fillStyle = `rgba(185, 28, 28, ${bs.alpha})`;
    ctx.beginPath(); ctx.arc(bs.x, bs.y, bs.size, 0, Math.PI * 2); ctx.fill();
  });

  sticks.forEach(s => {
    if (!s.visible) return;
    let col = skin.headCol;
    if (s.role === 'shirt') col = skin.shirtCol;
    if (s.role === 'pants') col = skin.pantsCol;
    if (shockTimer > 0 && Math.random() < 0.5) col = '#7dd3fc';
    ctx.strokeStyle = col; ctx.lineWidth = s.thickness; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(s.p0.x, s.p0.y); ctx.lineTo(s.p1.x, s.p1.y); ctx.stroke();
  });

  [dummy.lHand, dummy.rHand, dummy.lFoot, dummy.rFoot].forEach(p => {
    ctx.fillStyle = skin.headCol; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 2; ctx.stroke();
  });

  const h = dummy.head, angle = Math.atan2(h.y - dummy.neck.y, h.x - dummy.neck.x) + Math.PI * 0.5;
  ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(angle);
  if (skin.id === 'cosmic' || skin.id === 'god') { ctx.shadowColor = '#fde047'; ctx.shadowBlur = 18; }
  ctx.fillStyle = (hurtTimer > 38) ? '#fff' : (shockTimer > 0 && Math.random() < 0.5 ? '#bae6fd' : skin.headCol);
  ctx.beginPath(); ctx.arc(0, 0, h.r, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0; ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 3; ctx.stroke();

  if (skin.id === 'ninja') { ctx.fillStyle = '#dc2626'; ctx.fillRect(-25, -15, 50, 7); }
  else if (skin.id === 'knight') { ctx.fillStyle = '#475569'; ctx.fillRect(-20, -26, 40, 10); }
  else if (skin.id === 'robot') { ctx.fillStyle = '#06b6d4'; ctx.fillRect(-15, -7, 30, 7); }
  else if (skin.id === 'gold' || skin.id === 'god') { ctx.font = '22px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('👑', 0, -24); }

  ctx.fillStyle = '#18181b'; ctx.strokeStyle = '#18181b'; ctx.lineWidth = 2.5;
  if (hurtTimer > 0 || shockTimer > 0) {
    const drawX = (ox, oy) => { ctx.beginPath(); ctx.moveTo(ox - 5, oy - 5); ctx.lineTo(ox + 5, oy + 5); ctx.moveTo(ox + 5, oy - 5); ctx.lineTo(ox - 5, oy + 5); ctx.stroke(); };
    drawX(-8, -3); drawX(8, -3);
  } else if (skin.id !== 'robot') {
    ctx.beginPath(); ctx.arc(-8, -3, 4, 0, Math.PI * 2); ctx.arc(8, -3, 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, 5, 9, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  }
  ctx.restore();

  if (frozenTimer > 0) {
    ctx.save(); ctx.fillStyle = 'rgba(103, 232, 249, 0.42)'; ctx.strokeStyle = '#cffafe'; ctx.lineWidth = 3;
    ctx.fillRect(dummy.chest.x - 52, dummy.head.y - 35, 104, 155); ctx.strokeRect(dummy.chest.x - 52, dummy.head.y - 35, 104, 155);
    ctx.restore();
  }
}

function drawEffects() {
  beams.forEach(bm => {
    ctx.save(); ctx.globalAlpha = bm.life;
    ctx.fillStyle = 'rgba(56, 189, 248, 0.45)'; ctx.fillRect(bm.x - 45, 0, 90, height);
    ctx.fillStyle = '#fff'; ctx.fillRect(bm.x - 16, 0, 32, height); ctx.restore();
  });
  if (pinata) {
    ctx.save(); ctx.translate(pinata.x, pinata.y); ctx.font = '46px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🪅', 0, 0); ctx.font = '800 11px sans-serif'; ctx.fillStyle = '#fde047'; ctx.fillText(`KLIKNIJ! (${pinata.hp})`, 0, -32); ctx.restore();
  }
  if (meteorShower) {
    meteorShower.forEach(m => {
      ctx.font = '32px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('💰', m.x, m.y);
    });
  }
  shockwaves.forEach(sw => {
    ctx.save(); ctx.globalAlpha = Math.max(0, sw.life); ctx.strokeStyle = sw.color; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  });
  blackHoles.forEach(bh => {
    ctx.save(); ctx.translate(bh.x, bh.y); ctx.rotate(bh.angle);
    const grad = ctx.createRadialGradient(0, 0, 5, 0, 0, 68);
    grad.addColorStop(0, '#000'); grad.addColorStop(0.5, '#581c87'); grad.addColorStop(1, 'rgba(147, 51, 234, 0)');
    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(0, 0, 68, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#d8b4fe'; ctx.lineWidth = 3;
    for (let arm = 0; arm < 3; arm++) { ctx.rotate((Math.PI * 2) / 3); ctx.beginPath(); ctx.arc(15, 0, 24, 0, Math.PI); ctx.stroke(); }
    ctx.restore();
  });
  anvils.forEach(av => {
    ctx.save(); ctx.translate(av.x, av.y); ctx.fillStyle = '#334155'; ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2;
    ctx.fillRect(-28, -16, 56, 32); ctx.strokeRect(-28, -16, 56, 32);
    ctx.fillStyle = '#fff'; ctx.font = '900 13px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('100T', 0, 5); ctx.restore();
  });
  ctx.font = '30px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  rockets.forEach(rk => { ctx.fillText('🚀', rk.x, rk.y); });
  if (batSwing) { ctx.font = '46px sans-serif'; ctx.fillText(batSwing.icon || '🏏', batSwing.x, batSwing.y); }
  tracers.forEach(t => {
    ctx.strokeStyle = `rgba(254, 240, 138, ${t.life})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(t.x1, t.y1); ctx.lineTo(t.x2, t.y2); ctx.stroke();
  });
  lightnings.forEach(l => {
    ctx.strokeStyle = `rgba(125, 211, 252, ${l.life})`; ctx.lineWidth = 8;
    ctx.beginPath(); l.segments.forEach(s => { ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); }); ctx.stroke();
    ctx.strokeStyle = `rgba(255, 255, 255, ${l.life})`; ctx.lineWidth = 3; ctx.stroke();
  });
  ctx.font = '22px sans-serif'; bees.forEach(b => { ctx.fillText('🐝', b.x, b.y); });
  ctx.font = '64px sans-serif';
  animals.forEach(a => { ctx.save(); ctx.translate(a.x, a.y); if (a.dir > 0) ctx.scale(-1, 1); ctx.fillText(a.icon, 0, 0); ctx.restore(); });
  particles.forEach(pt => {
    ctx.globalAlpha = Math.max(0, pt.life); ctx.fillStyle = pt.color;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalAlpha = 1.0;
  floatingTexts.forEach(ft => {
    ctx.globalAlpha = Math.max(0, ft.life);
    ctx.font = `900 ${Math.round(18 * ft.scale)}px 'Segoe UI', sans-serif`; ctx.textAlign = 'center';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 4; ctx.strokeText(ft.text, ft.x, ft.y);
    ctx.fillStyle = ft.color; ctx.fillText(ft.text, ft.x, ft.y);
  });
  ctx.globalAlpha = 1.0;
  if (flashAlpha > 0) { ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`; ctx.fillRect(0, 0, width, height); }
}

function loop() {
  update();
  ctx.save();
  if (screenShake > 0.5) ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
  ctx.clearRect(-20, -20, width + 40, height + 40);
  drawArena(); drawDummy(); drawEffects();
  ctx.restore();
  requestAnimationFrame(loop);
}

loadSave(); resize(); initDummy(); loop();
</script>
