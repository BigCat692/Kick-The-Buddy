<!DOCTYPE html>

<head>

<style>

  #fever-wrap { display: flex; align-items: center; gap: 5px; background: rgba(15, 18, 28, 0.85); border: 1px solid rgba(244, 63, 94, 0.65); border-radius: 8px; padding: 2px 7px; }

  .btn-shop { background: linear-gradient(135deg, #c2410c, #f97316); border-color: #fdba74; color: #fff; }
  .btn-upgrade-hud { background: linear-gradient(135deg, #1d4ed8, #3b82f6); border-color: #93c5fd; color: #fff; font-variant-numeric: tabular-nums; }

  #bottom-bar-wrap { position: absolute; bottom: 8px; left: 8px; right: 8px; display: flex; align-items: center; gap: 5px; z-index: 35; pointer-events: none; }
  .bar-arrow { pointer-events: auto; background: linear-gradient(135deg, #1e293b, #0f172a); border: 1.5px solid #64748b; color: #fde047; width: 36px; height: 36px; border-radius: 10px; font-size: 16px; font-weight: 900; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }

  .shop-body { flex: 1; min-height: 0; display: flex; gap: 8px; }

  .scroll-pad { width: 52px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }

  .item-reward { font-size: 10.5px; color: #4ade80; font-weight: 800; font-variant-numeric: tabular-nums; }

<body>

function fmt(n) {
  if (!isFinite(n) || isNaN(n)) return '0';
  if (n < 1000) return Math.floor(n).toString();
  const suffixes = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc', 'Ud', 'Dd'];
  const tier = Math.floor(Math.log10(Math.abs(n)) / 3);
  if (tier === 0) return Math.floor(n).toString();
  const suffix = suffixes[tier] || `e${tier * 3}`;
  const scaled = n / Math.pow(10, tier * 3);
  return scaled.toFixed(scaled >= 100 ? 0 : (scaled >= 10 ? 1 : 2)) + suffix;
}

let settings = { sound: true, vibration: true, blood: true, forceLandscape: false };
let audioCtx = null, lastVibTs = 0;

function initAudio() {
  if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  if (!settings.sound) return;
  try {
    initAudio(); if (!audioCtx) return;
    const now = audioCtx.currentTime;
    if (type === 'hit' || type === 'bat' || type === 'slash') {
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = type === 'slash' ? 'sawtooth' : (type === 'bat' ? 'triangle' : 'sine');
      osc.frequency.setValueAtTime(type === 'slash' ? 520 : (type === 'bat' ? 195 : 135), now);
      osc.frequency.exponentialRampToValueAtTime(type === 'slash' ? 90 : 36, now + 0.12);
      gain.gain.setValueAtTime(0.32, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
      osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.12);
    } else if (type === 'saw') {
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(95 + Math.random() * 35, now);
      gain.gain.setValueAtTime(0.16, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
      osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.08);
    } else if (type === 'gun' || type === 'explosion' || type === 'nuke') {
      const dur = type === 'nuke' ? 0.65 : (type === 'explosion' ? 0.36 : 0.13);
      const bufSize = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate), data = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * (dur * 0.35)));
      const noise = audioCtx.createBufferSource(); noise.buffer = buf;
      const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass';
      filter.frequency.setValueAtTime(type === 'nuke' ? 280 : (type === 'explosion' ? 480 : 1400), now);
      const gain = audioCtx.createGain(); gain.gain.setValueAtTime(type === 'nuke' ? 0.65 : (type === 'explosion' ? 0.45 : 0.25), now);
      noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination); noise.start(now);
    } else if (type === 'laser') {
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'square'; osc.frequency.setValueAtTime(720, now); osc.frequency.exponentialRampToValueAtTime(200, now + 0.07);
      gain.gain.setValueAtTime(0.13, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.07);
      osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.07);
    } else if (type === 'freeze') {
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(900, now); osc.frequency.linearRampToValueAtTime(1600, now + 0.16);
      gain.gain.setValueAtTime(0.22, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
      osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.16);
    } else if (type === 'coin' || type === 'quest') {
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(type === 'quest' ? 587 : 880, now);
      osc.frequency.setValueAtTime(type === 'quest' ? 880 : 1320, now + 0.06);
      gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
      osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.16);
    }
  } catch (e) {}
}

// Bezpieczna, synchroniczna wibracja (odpalana w touchstart, żeby Android nie blokował!)
function vibrate(pattern, force = false) {
  if (!settings.vibration && !force) return;
  try {
    if (typeof navigator !== 'undefined' && typeof navigator.vibrate === 'function') {
      navigator.vibrate(0);
      navigator.vibrate(pattern);
    }
  } catch (e) {}
}

function testVibration() {
  const st = document.getElementById('vib-status');
  if (typeof navigator === 'undefined' || typeof navigator.vibrate !== 'function') {
    st.textContent = '❌ Ten WebView nie ma API wibracji (uruchom przez Chrome -> Dodaj do ekranu głównego).';
    st.style.color = '#f87171';
    return;
  }
  const ok = navigator.vibrate([200, 70, 280]);
  st.textContent = ok ? '✅ Wysłano mocną wibrację! Jeśli telefon nie drgnął, włącz "Wibracje dotyku" w Androidzie lub odpal w Chrome.' : '⚠️ Zablokowane przez APK/tryb oszczędzania baterii.';
  st.style.color = ok ? '#4ade80' : '#facc15';
}

function resize() {
  const vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
  const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  if (settings.forceLandscape) { width = canvas.width = Math.max(300, Math.floor(vh)); height = canvas.height = Math.max(200, Math.floor(vw)); }
  else { width = canvas.width = Math.max(300, Math.floor(vw)); height = canvas.height = Math.max(200, Math.floor(vh)); }

function loadSave() {
  try {
    const m = localStorage.getItem('ktb4_money'); if (m !== null) money = parseFloat(m) || 0;
    if (!isFinite(money) || money < 0) money = 0;
    const u = localStorage.getItem('ktb4_unlocked'); if (u) unlocked = JSON.parse(u);
    if (!Array.isArray(unlocked) || !unlocked.includes('hand')) unlocked = ['hand'];
    const wl = localStorage.getItem('ktb4_wlevels'); if (wl) Object.assign(weaponLevels, JSON.parse(wl));
    const tl = localStorage.getItem('ktb4_tlevels'); if (tl) Object.assign(turretLevels, JSON.parse(tl));
    const sk = localStorage.getItem('ktb4_skins'); if (sk) unlockedSkins = JSON.parse(sk);
    const csk = localStorage.getItem('ktb4_cur_skin'); if (csk && unlockedSkins.includes(csk)) currentSkin = csk;
    const pr = localStorage.getItem('ktb4_prestige'); if (pr !== null) prestigeLevel = parseInt(pr, 10) || 0;
    const th = localStorage.getItem('ktb4_theme'); if (th) currentTheme = th;
    const st = localStorage.getItem('ktb4_settings'); if (st) Object.assign(settings, JSON.parse(st));
    const lg = localStorage.getItem('ktb4_lang'); if (lg && LANG[lg]) { currentLang = lg; document.getElementById('lang-select').value = lg; }
  } catch (e) {}
  updateLangUI(); applySettingsUI(); generateQuest(); updateHUD(); renderBottomBar();
}

function saveGame() {
  try {
    localStorage.setItem('ktb4_money', money);
    localStorage.setItem('ktb4_unlocked', JSON.stringify(unlocked));
    localStorage.setItem('ktb4_wlevels', JSON.stringify(weaponLevels));
    localStorage.setItem('ktb4_tlevels', JSON.stringify(turretLevels));
    localStorage.setItem('ktb4_skins', JSON.stringify(unlockedSkins));
    localStorage.setItem('ktb4_cur_skin', currentSkin);
    localStorage.setItem('ktb4_prestige', prestigeLevel);
    localStorage.setItem('ktb4_theme', currentTheme);
    localStorage.setItem('ktb4_settings', JSON.stringify(settings));
    localStorage.setItem('ktb4_lang', currentLang);
  } catch (e) {}
}

function hardReset() {
  if (!confirm('Zresetować cały postęp, wieżyczki i Prestige do zera?')) return;
  localStorage.clear();
  money = 0; unlocked = ['hand']; WEAPONS.forEach(w => { weaponLevels[w.id] = 1; }); TURRETS.forEach(tb => { turretLevels[tb.id] = 0; });
  unlockedSkins = ['classic']; currentSkin = 'classic'; prestigeLevel = 0; currentTheme = 'box'; currentWeapon = 'hand';
  combo = 0; fever = 0; overdriveTimer = 0; goldRushTimer = 0;
  generateQuest(); saveGame(); toggleSettings(); updateHUD(); renderBottomBar(); resetDummy();
}

function getSkinMult() { const s = SKINS.find(x => x.id === currentSkin); return s ? s.mult : 1.0; }
function getPrestigeMult() { return Math.pow(1.75, prestigeLevel); }
function getTotalMultiplier() {
  let m = getSkinMult() * getPrestigeMult();
  if (goldRushTimer > 0) m *= 2;
  if (overdriveTimer > 0) m *= 3;
  if (combo > 1) m *= (1 + Math.min(combo, 75) * 0.02);
  return m;
}
function getWeaponLevel(id) { return weaponLevels[id] || 1; }
function getWeaponUpgradeCost(w) { return Math.round(w.upgBase * Math.pow(1.62, getWeaponLevel(w.id) - 1)); }
function getWeaponReward(w) { return Math.max(1, Math.round(w.reward * Math.pow(1.24, getWeaponLevel(w.id) - 1) * getTotalMultiplier())); }
function getTurretCost(tb) { return Math.round(tb.cost * Math.pow(1.75, turretLevels[tb.id] || 0)); }
function getTurretShotReward(tb) { const lv = turretLevels[tb.id] || 0; return lv <= 0 ? 0 : Math.max(1, Math.round(tb.baseDps * Math.pow(1.32, lv - 1) * getTotalMultiplier())); }
function getTotalDps() { let dps = 0; TURRETS.forEach(tb => { if ((turretLevels[tb.id] || 0) > 0) dps += getTurretShotReward(tb) * (60 / tb.rate); }); return dps; }
function getBestUnlockedBaseReward() { let best = 2; WEAPONS.forEach(w => { if (unlocked.includes(w.id)) { const r = getWeaponReward(w); if (r > best) best = r; } }); return best; }
function getNextLockedWeapon() { return WEAPONS.find(w => !unlocked.includes(w.id)) || null; }

function updateNextWeaponHUD() {
  const btn = document.getElementById('next-weapon-btn');
  const lbl = document.getElementById('nw-label');
  const fill = document.getElementById('nw-prog-fill');
  const nextW = getNextLockedWeapon();
  if (!nextW) {
    const pCost = getPrestigeCost(), canP = money >= pCost;
    lbl.textContent = canP ? `🌟 PRESTIGE GOTOWY! ($${fmt(pCost)})` : `🌟 Prestige: $${fmt(pCost)}`;
    fill.style.width = `${Math.min(100, Math.round((money / pCost) * 100))}%`;
    btn.classList.toggle('ready', canP);
    return;
  }
  const canBuy = money >= nextW.cost;
  lbl.textContent = canBuy ? `${tr('buyNow')} ${nextW.icon} ${nextW.name} ($${fmt(nextW.cost)})` : `${tr('nextLock')} ${nextW.icon} ${nextW.name} ($${fmt(nextW.cost)})`;
  fill.style.width = `${Math.min(100, Math.round((money / nextW.cost) * 100))}%`;
  btn.classList.toggle('ready', canBuy);
}

function quickBuyNextWeapon() {
  const nextW = getNextLockedWeapon();
  if (!nextW) { toggleShop(); switchCategory('prestige', document.getElementById('tab-pr')); return; }
  if (money >= nextW.cost) {
    money -= nextW.cost;
    unlocked.push(nextW.id);
    currentWeapon = nextW.id;
    playSound('quest'); vibrate([80, 40, 120]);
    saveGame(); renderBottomBar(); updateHUD();
    const bar = document.getElementById('bottom-bar'); bar.scrollLeft = bar.scrollWidth;
  } else {
    vibrate(30);
    toggleShop();
  }
}

function addMoney(amount, x, y, customLabel = '', customColor = '') {
  if (!isFinite(amount) || amount <= 0) return;
  money += amount; updateHUD(); saveGame();
  if (x !== undefined && y !== undefined) {
    if (floatingTexts.length > 26) floatingTexts.shift();
    floatingTexts.push({
      x: x + (Math.random() - 0.5) * 32, y: y - 10,
      text: customLabel ? `${customLabel} +$${fmt(amount)}` : `+$${fmt(amount)}`,
      vy: -2.3, life: 1.0,
      color: customColor || (customLabel ? '#fde047' : (overdriveTimer > 0 ? '#fb7185' : '#4ade80')),
      scale: customLabel ? 1.28 : 1.0
    });
  }
}

function generateQuest() {
  const base = getBestUnlockedBaseReward();
  const types = [
    { type: 'hits', target: 25 + Math.floor(Math.random() * 25), mult: 10, label: n => `${tr('quest')} ${tr('qHits')} ${n}x` },
    { type: 'combo', target: 15 + Math.floor(Math.random() * 15), mult: 12, label: n => `${tr('quest')} ${tr('qCombo')} x${n}` },
    { type: 'upgrade', target: 1, mult: 14, label: () => `${tr('quest')} ${tr('qUpg')}` },
    { type: 'wall', target: 8, mult: 11, label: n => `${tr('quest')} ${tr('qWall')} ${n}x` }
  ];
  const pick = types[Math.floor(Math.random() * types.length)];
  quest = { type: pick.type, target: pick.target, progress: 0, reward: Math.max(30, Math.round(base * pick.mult)), text: pick.label(pick.target) };
  updateQuestUI();
}

function advanceQuest(type, val = 1, isAbsolute = false) {
  if (quest.type !== type) return;
  quest.progress = isAbsolute ? Math.max(quest.progress, val) : quest.progress + val;
  if (quest.progress >= quest.target) {
    playSound('quest'); vibrate([60, 30, 100]);
    addMoney(quest.reward, width * 0.5, height * 0.3, '🎁 MISJA!');
    generateQuest();
  } else updateQuestUI();
}

function updateQuestUI() {
  document.getElementById('quest-text').textContent = `${quest.text} (${quest.progress}/${quest.target})`;
  document.getElementById('quest-reward').textContent = `+$${fmt(quest.reward)}`;
  document.getElementById('quest-fill').style.width = `${Math.min(100, Math.round((quest.progress / quest.target) * 100))}%`;
}

function renderBottomBar() {
  const bar = document.getElementById('bottom-bar'); bar.innerHTML = '';
  WEAPONS.forEach(w => {
    if (!unlocked.includes(w.id)) return;
    const lv = getWeaponLevel(w.id), btn = document.createElement('div');
    btn.className = 'weapon-slot' + (currentWeapon === w.id ? ' active' : '');
    btn.innerHTML = `<span>${w.icon}</span><span>${w.name}</span><span class="lv-tag">Lv.${lv}</span>`;
    btn.onclick = () => { currentWeapon = w.id; vibrate(30); renderBottomBar(); updateHUD(); };
    bar.appendChild(btn);
  });
  updateHUD();
}

function upgradeCurrentWeapon() {
  const w = WEAPONS.find(x => x.id === currentWeapon); if (!w) return;
  const cost = getWeaponUpgradeCost(w);
  if (money >= cost) {
    money -= cost; weaponLevels[w.id] = getWeaponLevel(w.id) + 1;
    playSound('coin'); vibrate([45, 20, 60]); advanceQuest('upgrade', 1); saveGame(); renderBottomBar();
    if (document.getElementById('shop-modal').classList.contains('open')) renderShopList();
  }
}

// Płynne przewijanie na przytrzymanie strzałek
function bindHoldScroll(btnId, targetId, axis, delta) {
  const btn = document.getElementById(btnId);
  if (!btn) return;
  let timer = null;
  const stop = () => { if (timer) { clearInterval(timer); timer = null; } };
  const start = (e) => {
    e.preventDefault(); stop();
    const el = document.getElementById(targetId); if (!el) return;
    const step = () => { if (axis === 'y') el.scrollTop += delta; else el.scrollLeft += delta; };
    step();
    timer = setInterval(step, 16);
  };
  btn.addEventListener('touchstart', start, { passive: false });
  btn.addEventListener('mousedown', start);
  ['touchend', 'touchcancel', 'mouseup', 'mouseleave'].forEach(ev => btn.addEventListener(ev, stop));
};
const gravity = 0.42, friction = 0.985, bounce = 0.58;
let points = [], sticks = [], dummy = {};
let particles = [], shockwaves = [], floatingTexts = [], tracers = [], bees = [], animals = [], blackHoles = [], lightnings = [], anvils = [], rockets = [], bloodSplats = [], swipeTrail = [], vfxList = [], projectiles = [];
let screenShake = 0, flashAlpha = 0, hurtTimer = 0, shockTimer = 0, burnTimer = 0, burnTick = 0, frozenTimer = 0, acidTimer = 0, frameCount = 0;

function getBoxBounds() { return { left: 12, right: Math.max(200, width - 12), top: 58, bottom: Math.max(180, height - 56) }; }

class Point { constructor(x, y, r, name = '') { this.x = x; this.y = y; this.oldx = x; this.oldy = y; this.r = r; this.name = name; } }
class Stick {
  constructor(p0, p1, len, thickness, role, visible = true) {
    this.p0 = p0; this.p1 = p1; this.len = len || Math.hypot(p1.x - p0.x, p1.y - p0.y);
    this.thickness = thickness; this.role = role; this.visible = visible;
  }
}

function clampDummyToBounds() {
  if (!points.length) return;
  const b = getBoxBounds();
  for (let i = 0; i < points.length; i++) {
    const p = points[i];
    if (!isFinite(p.x) || !isFinite(p.y)) { initDummy(); return; }
    p.x = Math.min(b.right - p.r, Math.max(b.left + p.r, p.x));
    p.y = Math.min(b.bottom - p.r, Math.max(b.top + p.r, p.y));
    p.oldx = p.x; p.oldy = p.y;
  }
}

function addShockwave(x, y, maxR = 120, color = '#facc15') {
  if (shockwaves.length > 14) shockwaves.shift();
  shockwaves.push({ x, y, r: 10, maxR, color, life: 1.0 });
}

function addVfx(obj) {
  if (vfxList.length > 25) vfxList.shift();
  vfxList.push(Object.assign({ life: 1.0, maxLife: 1.0 }, obj));
}

function spawnStuffing(x, y, count = 10, speed = 8, customColor = null) {
  for (let i = 0; i < count; i++) {
    if (particles.length > 140) particles.shift();
    const a = Math.random() * Math.PI * 2, s = 1.5 + Math.random() * speed, t = Math.random();
    particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1.5, size: 2.8 + Math.random() * 4.2,
      color: customColor || (t < 0.45 ? '#f5e6cc' : (t < 0.8 ? '#f59e0b' : '#ef4444')), life: 1.0
    });
  }
}

function addBattleMark() {
  if (!settings.blood) return;
  const targetIdx = Math.floor(Math.random() * 4);
  bloodSplats.push({ idx: targetIdx, ox: (Math.random() - 0.5) * 20, oy: (Math.random() - 0.5) * 20, size: 3.5 + Math.random() * 5.5, alpha: 0.78 });
  if (bloodSplats.length > 26) bloodSplats.shift();
}

function applyForceToDummy(originX, originY, forceX, forceY, radius = 175) {
  points.forEach(p => {
    const d = Math.hypot(p.x - originX, p.y - originY);
    if (d < radius) { const factor = 1 - (d / radius) * 0.45; p.oldx -= forceX * factor; p.oldy -= forceY * factor; }
  });
}

function registerCombo() {
  combo++; comboTimer = 115;
  if (overdriveTimer <= 0) {
    fever = Math.min(100, fever + 2.8);
    if (fever >= 100) {
      overdriveTimer = 600;
      playSound('quest'); vibrate([100, 40, 160]);
      addShockwave(dummy.chest.x, dummy.chest.y, 240, '#f43f5e');
    }
  }
  const box = document.getElementById('combo-box');
  if (combo >= 2) {
    box.style.display = 'block'; box.style.transform = 'scale(1.2)';
    setTimeout(() => { box.style.transform = 'scale(1)'; }, 75);
    document.getElementById('combo-num').textContent = `COMBO x${combo}`;
    document.getElementById('combo-sub').textContent = `Bonus +${Math.min(combo, 75) * 2}%`;
    advanceQuest('combo', combo, true);
  }
}

function hitDummy(baseReward, x, y, fx, fy, shake = 7, soundType = 'hit', fromTurret = false) {
  if (!fromTurret) { registerCombo(); advanceQuest('hits', 1); }
  let finalReward = baseReward, label = '', col = '';
  if (frozenTimer > 0 && soundType !== 'freeze') {
    frozenTimer = 0; finalReward = Math.round(finalReward * 2.5); label = '❄️ KRUSZENIE x2.5!'; col = '#67e8f9';
    addShockwave(x, y, 155, '#67e8f9'); spawnStuffing(x, y, 22, 13, '#67e8f9'); playSound('explosion');
  } else {
    if (!fromTurret && Math.random() < 0.12) {
      finalReward *= 3; label = '💥 CRIT x3!'; col = '#fb7185'; shake = Math.max(shake, 13);
      addShockwave(x, y, 115, '#fb7185');
    }
    if (!fromTurret) playSound(soundType);
  }
  hurtTimer = 42; screenShake = Math.max(screenShake, fromTurret ? 2 : shake);
  addBattleMark();
  addMoney(finalReward, x, y, label, col);
  spawnStuffing(x, y, fromTurret ? 4 : 10, fromTurret ? 5 : 8);
  applyForceToDummy(x, y, fx, fy, 180);
}

function makeBolt(tx, ty, col = '#7dd3fc') {
  const segments = [];
  let curX = tx + (Math.random() - 0.5) * 90, curY = getBoxBounds().top;
  while (curY < ty) {
    const nextY = Math.min(ty, curY + 24 + Math.random() * 24);
    const nextX = nextY === ty ? tx : curX + (Math.random() - 0.5) * 65;
    segments.push({ x1: curX, y1: curY, x2: nextX, y2: nextY });
    curX = nextX; curY = nextY;
  }
  lightnings.push({ segments, life: 1.0, col });
}

function onPointerMove(e) {
  if (!pointer.down) return;
  const pos = getPointerPos(e);
  pointer.prevX = pointer.x; pointer.prevY = pointer.y; pointer.x = pos.x; pointer.y = pos.y;
  swipeTrail.push({ x: pos.x, y: pos.y, life: 1.0 });
  if (swipeTrail.length > 18) swipeTrail.shift();
  const w = getWeaponData(currentWeapon);
  // Synchroniczna wibracja podczas przytrzymania i przesuwania broni ciągłych
  if (w.vfx.startsWith('hold_')) {
    const now = Date.now();
    if (now - lastVibTs > 130) { lastVibTs = now; vibrate(w.vib); }
  } else if (w.cat === 'melee' && w.vfx !== 'hand' && w.vfx !== 'anvil') {
    const speed = Math.hypot(pointer.x - pointer.prevX, pointer.y - pointer.prevY);
    if (speed > 16 && Math.hypot(dummy.chest.x - pointer.x, dummy.chest.y - pointer.y) < 95) {
      vibrate(w.vib);
      hitDummy(getWeaponReward(w), dummy.chest.x, dummy.chest.y, (pointer.x - pointer.prevX) * 0.85, (pointer.y - pointer.prevY) * 0.85, 9, 'bat');
    }
  }
}

function onPointerUp() { pointer.down = false; pointer.grabbed = null; }
canvas.addEventListener('mousedown', onPointerDown); window.addEventListener('mousemove', onPointerMove); window.addEventListener('mouseup', onPointerUp);
canvas.addEventListener('touchstart', onPointerDown, { passive: false }); canvas.addEventListener('touchmove', e => { e.preventDefault(); onPointerMove(e); }, { passive: false }); window.addEventListener('touchend', onPointerUp);

function fireGun(tx, ty, pellets, spread, reward, knockback, shake, col = '#fef08a') {
  const sx = width * 0.5, sy = height - 58;
  let hitAny = false;
  for (let i = 0; i < pellets; i++) {
    const px = tx + (Math.random() - 0.5) * spread * 240, py = ty + (Math.random() - 0.5) * spread * 240;
    tracers.push({ x1: sx, y1: sy, x2: px, y2: py, life: 1.0, col });
    points.forEach(p => { if (Math.hypot(p.x - px, p.y - py) < p.r + 45) hitAny = true; });
  }
  playSound('gun'); screenShake = Math.max(screenShake, shake);
  if (hitAny || Math.hypot(dummy.chest.x - tx, dummy.chest.y - ty) < 115) {
    const ang = Math.atan2(dummy.chest.y - sy, dummy.chest.x - sx);
    hitDummy(reward, dummy.chest.x, dummy.chest.y, Math.cos(ang) * knockback + (Math.random() - 0.5) * 10, Math.sin(ang) * knockback - 6, shake, 'gun');
  }
}

let beeStingTick = 0;
function spawnBeesBalanced(x, y, reward) {
  if (bees.length > 0) {
    bees.forEach(b => { b.timer = 180; b.reward = reward; });
    hitDummy(reward, dummy.head.x, dummy.head.y, (Math.random() - 0.5) * 8, -4, 4, 'hit');
    return;
  }
  for (let i = 0; i < 8; i++) bees.push({ x: x + (Math.random() - 0.5) * 60, y: y + (Math.random() - 0.5) * 60, vx: 0, vy: 0, timer: 180, reward });
}

function spawnAnimal(type, icon, reward, speedX, speedY) {
  const b = getBoxBounds(), fl = Math.random() < 0.5;
  const yPos = (type === 'dragon' || type === 'phoenix') ? b.top + 60 : Math.min(b.bottom - 38, dummy.chest.y + 12);
  animals.push({ type, icon, x: fl ? -60 : width + 60, y: yPos, vx: fl ? speedX : -speedX, vy: speedY, dir: fl ? 1 : -1, reward, hasHit: false, tick: 0 });
  playSound('explosion');
};
