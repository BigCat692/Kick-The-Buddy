function fmt(n) {
  if (!isFinite(n) || isNaN(n)) return '0';
  if (n < 1000) return Math.floor(n).toString();
  const suffixes = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc', 'Ud', 'Dd'];
  const tier = Math.floor(Math.log10(Math.abs(n)) / 3);
  if (tier === 0) return Math.floor(n).toString();
  const suffix = suffixes[tier] || `e${tier * 3}`;
  const scaled = n / Math.pow(10, tier * 3);
  return scaled.toFixed(scaled >= 100 ? 0 : (scaled >= 10 ? 1 : 2)) + suffix;
}

let settings = { sound: true, vibration: true, blood: true, forceLandscape: false };
let audioCtx = null;
function initAudio() {
  if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  if (!settings.sound) return;
  try {
    initAudio(); if (!audioCtx) return;
    const now = audioCtx.currentTime;
    if (type === 'hit' || type === 'bat') {
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = type === 'bat' ? 'triangle' : 'sine';
      osc.frequency.setValueAtTime(type === 'bat' ? 195 : 135, now);
      osc.frequency.exponentialRampToValueAtTime(36, now + 0.11);
      gain.gain.setValueAtTime(0.32, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.11);
      osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.11);
    } else if (type === 'saw') {
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(95 + Math.random() * 35, now);
      gain.gain.setValueAtTime(0.16, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
      osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.08);
    } else if (type === 'gun' || type === 'explosion' || type === 'nuke') {
      const dur = type === 'nuke' ? 0.65 : (type === 'explosion' ? 0.36 : 0.13);
      const bufSize = Math.floor(audioCtx.sampleRate * dur), buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate), data = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * (dur * 0.35)));
      const noise = audioCtx.createBufferSource(); noise.buffer = buf;
      const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass';
      filter.frequency.setValueAtTime(type === 'nuke' ? 280 : (type === 'explosion' ? 480 : 1400), now);
      const gain = audioCtx.createGain(); gain.gain.setValueAtTime(type === 'nuke' ? 0.65 : (type === 'explosion' ? 0.45 : 0.25), now);
      noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination); noise.start(now);
    } else if (type === 'laser') {
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'square'; osc.frequency.setValueAtTime(720, now); osc.frequency.exponentialRampToValueAtTime(200, now + 0.07);
      gain.gain.setValueAtTime(0.13, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.07);
      osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.07);
    } else if (type === 'freeze') {
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(900, now); osc.frequency.linearRampToValueAtTime(1600, now + 0.16);
      gain.gain.setValueAtTime(0.22, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
      osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.16);
    } else if (type === 'coin' || type === 'quest') {
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(type === 'quest' ? 587 : 880, now);
      osc.frequency.setValueAtTime(type === 'quest' ? 880 : 1320, now + 0.06);
      gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
      osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.16);
    }
  } catch (e) {}
}

function vibrate(pattern) {

  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
}

function getSkinMult() { const s = SKINS.find(x => x.id === currentSkin); return s ? s.mult : 1.0; }
function getPrestigeMult() { return Math.pow(1.75, prestigeLevel); }
function getTotalMultiplier() {
  let m = getSkinMult() * getPrestigeMult();
  if (goldRushTimer > 0) m *= 2;
  if (overdriveTimer > 0) m *= 3;
  if (combo > 1) m *= (1 + Math.min(combo, 75) * 0.02);
  return m;
}
function getWeaponLevel(id) { return weaponLevels[id] || 1; }
function getWeaponUpgradeCost(w) { return Math.round(w.upgBase * Math.pow(1.62, getWeaponLevel(w.id) - 1)); }
function getWeaponReward(w) { return Math.max(1, Math.round(w.reward * Math.pow(1.24, getWeaponLevel(w.id) - 1) * getTotalMultiplier())); }
function getTurretCost(tb) { const lv = turretLevels[tb.id] || 0; return Math.round(tb.cost * Math.pow(1.75, lv)); }
function getTurretShotReward(tb) { const lv = turretLevels[tb.id] || 0; if (lv <= 0) return 0; return Math.max(1, Math.round(tb.baseDps * Math.pow(1.32, lv - 1) * getTotalMultiplier())); }
function getTotalDps() {
  let dps = 0;
  TURRETS.forEach(tb => { if ((turretLevels[tb.id] || 0) > 0) dps += getTurretShotReward(tb) * (60 / tb.rate); });
  return dps;
}
function getBestUnlockedBaseReward() {

function generateQuest() {
  const base = getBestUnlockedBaseReward();
  const types = [
    { type: 'hits', target: 25 + Math.floor(Math.random() * 25), mult: 10, label: n => `${tr('quest')} ${tr('qHits')} ${n}x` },
    { type: 'combo', target: 15 + Math.floor(Math.random() * 15), mult: 12, label: n => `${tr('quest')} ${tr('qCombo')} x${n}` },
    { type: 'upgrade', target: 1, mult: 14, label: () => `${tr('quest')} ${tr('qUpg')}` },
    { type: 'wall', target: 8, mult: 11, label: n => `${tr('quest')} ${tr('qWall')} ${n}x` }
  ];
  const pick = types[Math.floor(Math.random() * types.length)];
  quest = { type: pick.type, target: pick.target, progress: 0, reward: Math.max(30, Math.round(base * pick.mult)), text: pick.label(pick.target) };
  updateQuestUI();
}

function advanceQuest(type, val = 1, isAbsolute = false) {
  if (quest.type !== type) return;
  quest.progress = isAbsolute ? Math.max(quest.progress, val) : quest.progress + val;
  if (quest.progress >= quest.target) {
    playSound('quest'); vibrate([40, 30, 75]);
    addMoney(quest.reward, width * 0.5, height * 0.3, '🎁 MISJA!');
    generateQuest();
  } else updateQuestUI();
}

function updateQuestUI() {
  document.getElementById('quest-text').textContent = `${quest.text} (${quest.progress}/${quest.target})`;
  document.getElementById('quest-reward').textContent = `+$${fmt(quest.reward)}`;
  document.getElementById('quest-fill').style.width = `${Math.min(100, Math.round((quest.progress / quest.target) * 100))}%`;

const gravity = 0.42, friction = 0.985, bounce = 0.58;

function getBoxBounds() { return { left: 12, right: Math.max(200, width - 12), top: 58, bottom: Math.max(180, height - 56) }; }

class Point {
  constructor(x, y, r, name = '') { this.x = x; this.y = y; this.oldx = x; this.oldy = y; this.r = r; this.name = name; }
}
class Stick {
  constructor(p0, p1, len, thickness, role, visible = true) {
    this.p0 = p0; this.p1 = p1; this.len = len || Math.hypot(p1.x - p0.x, p1.y - p0.y);
    this.thickness = thickness; this.role = role; this.visible = visible;
  }
}

function clampDummyToBounds() {
  if (!points.length) return;
  const b = getBoxBounds();
  for (let i = 0; i < points.length; i++) {
    const p = points[i];
    if (!isFinite(p.x) || !isFinite(p.y)) { initDummy(); return; }
    p.x = Math.min(b.right - p.r, Math.max(b.left + p.r, p.x));
    p.y = Math.min(b.bottom - p.r, Math.max(b.top + p.r, p.y));
    p.oldx = p.x; p.oldy = p.y;
  }
}

function spawnStuffing(x, y, count = 10, speed = 8, customColor = null) {
  for (let i = 0; i < count; i++) {
    if (particles.length > 130) particles.shift();
    const a = Math.random() * Math.PI * 2, s = 1.5 + Math.random() * speed, t = Math.random();
    particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1.5, size: 2.8 + Math.random() * 4,

  bloodSplats.push({ idx: targetIdx, ox: (Math.random() - 0.5) * 20, oy: (Math.random() - 0.5) * 20, size: 3.5 + Math.random() * 5.5, alpha: 0.75 });

function applyForceToDummy(originX, originY, forceX, forceY, radius = 165) {
  points.forEach(p => {
    const d = Math.hypot(p.x - originX, p.y - originY);
    if (d < radius) {
      const factor = 1 - (d / radius) * 0.45;
      p.oldx -= forceX * factor; p.oldy -= forceY * factor;
    }
  });
}

  const b = getBoxBounds(), theme = THEMES.find(th => th.id === currentTheme) || THEMES[0];
  const grad = ctx.createRadialGradient(width * 0.5, height * 0.45, 30, width * 0.5, height * 0.5, Math.max(width, height) * 0.72);
  grad.addColorStop(0, theme.c1); grad.addColorStop(1, theme.c2);
  ctx.fillStyle = grad; ctx.fillRect(b.left, b.top, b.right - b.left, b.bottom - b.top);
  ctx.strokeStyle = theme.line; ctx.lineWidth = 2.5;
  const padX = (b.right - b.left) * 0.11, padY = (b.bottom - b.top) * 0.13;
  ctx.strokeRect(b.left + padX, b.top + padY, (b.right - b.left) - padX * 2, (b.bottom - b.top) - padY * 2);
  ctx.beginPath();
  ctx.moveTo(b.left, b.top); ctx.lineTo(b.left + padX, b.top + padY);
  ctx.moveTo(b.right, b.top); ctx.lineTo(b.right - padX, b.top + padY);
  ctx.moveTo(b.left, b.bottom); ctx.lineTo(b.left + padX, b.bottom - padY);
  ctx.moveTo(b.right, b.bottom); ctx.lineTo(b.right - padX, b.bottom - padY);
  ctx.stroke();

  // Rysowanie posiadanych Wieżyczek w górnym rogu areny
  TURRETS.forEach((tb, idx) => {
    if ((turretLevels[tb.id] || 0) > 0) {
      const tx = b.left + 45 + idx * 54, ty = b.top + 28 + Math.sin(frameCount * 0.08 + idx) * 3;
      ctx.font = '26px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(tb.icon, tx, ty);
    }
  });

  ctx.strokeStyle = overdriveTimer > 0 ? '#f43f5e' : (goldRushTimer > 0 ? '#facc15' : theme.border);
  ctx.lineWidth = (overdriveTimer > 0 || goldRushTimer > 0) ? 6 : 4;
  ctx.strokeRect(b.left, b.top, b.right - b.left, b.bottom - b.top);
}

function drawDummy() {
  const skin = SKINS.find(s => s.id === currentSkin) || SKINS[0];
  const b = getBoxBounds();
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(dummy.chest.x, b.bottom - 4, 38, 8, 0, 0, Math.PI * 2); ctx.fill();

  sticks.forEach(s => {
    if (!s.visible) return;
    let col = skin.headCol;
    if (s.role === 'shirt') col = skin.shirtCol;
    if (s.role === 'pants') col = skin.pantsCol;
    if (shockTimer > 0 && Math.random() < 0.5) col = '#7dd3fc';
    ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = s.thickness + 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(s.p0.x, s.p0.y); ctx.lineTo(s.p1.x, s.p1.y); ctx.stroke();
    ctx.strokeStyle = col; ctx.lineWidth = s.thickness;
    ctx.beginPath(); ctx.moveTo(s.p0.x, s.p0.y); ctx.lineTo(s.p1.x, s.p1.y); ctx.stroke();
  });

  [dummy.lHand, dummy.rHand, dummy.lFoot, dummy.rFoot].forEach(p => {
    ctx.fillStyle = skin.headCol; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 2; ctx.stroke();
  });

  // Ślady walki przyczepione do ciała kukły
  if (settings.blood) {
    bloodSplats.forEach(bs => {
      const host = points[bs.idx] || dummy.chest;
      ctx.fillStyle = `rgba(185, 28, 28, ${bs.alpha})`;
      ctx.beginPath(); ctx.arc(host.x + bs.ox, host.y + bs.oy, bs.size, 0, Math.PI * 2); ctx.fill();
    });
  }

  const h = dummy.head, angle = Math.atan2(h.y - dummy.neck.y, h.x - dummy.neck.x) + Math.PI * 0.5;
  ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(angle);
  if (skin.id === 'cosmic' || skin.id === 'god') { ctx.shadowColor = '#fde047'; ctx.shadowBlur = 18; }
  ctx.fillStyle = (hurtTimer > 36) ? '#fff' : (shockTimer > 0 && Math.random() < 0.5 ? '#bae6fd' : skin.headCol);
  ctx.beginPath(); ctx.arc(0, 0, h.r, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0; ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 3; ctx.stroke();

  if (skin.id === 'ninja') { ctx.fillStyle = '#dc2626'; ctx.fillRect(-24, -14, 48, 7); }
  else if (skin.id === 'soldier') { ctx.fillStyle = '#365314'; ctx.beginPath(); ctx.arc(0, -6, 25, Math.PI, 0); ctx.fill(); }
  else if (skin.id === 'knight') { ctx.fillStyle = '#475569'; ctx.fillRect(-20, -25, 40, 10); }
  else if (skin.id === 'robot') { ctx.fillStyle = '#06b6d4'; ctx.fillRect(-15, -7, 30, 7); }
  else if (skin.id === 'demon') { ctx.fillStyle = '#18181b'; ctx.beginPath(); ctx.moveTo(-15, -18); ctx.lineTo(-23, -33); ctx.lineTo(-5, -22); ctx.fill(); ctx.beginPath(); ctx.moveTo(15, -18); ctx.lineTo(23, -33); ctx.lineTo(5, -22); ctx.fill(); }
  else if (skin.id === 'gold' || skin.id === 'god') { ctx.font = '21px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('👑', 0, -23); }

  ctx.fillStyle = '#18181b'; ctx.strokeStyle = '#18181b'; ctx.lineWidth = 2.5;
  if (hurtTimer > 0 || shockTimer > 0) {
    const drawX = (ox, oy) => { ctx.beginPath(); ctx.moveTo(ox - 5, oy - 5); ctx.lineTo(ox + 5, oy + 5); ctx.moveTo(ox + 5, oy - 5); ctx.lineTo(ox - 5, oy + 5); ctx.stroke(); };
    drawX(-8, -3); drawX(8, -3);
    ctx.fillStyle = '#450a0a'; ctx.beginPath(); ctx.arc(0, 10, 6, 0, Math.PI * 2); ctx.fill();
  } else if (skin.id !== 'robot') {
    ctx.beginPath(); ctx.arc(-8, -3, 3.8, 0, Math.PI * 2); ctx.arc(8, -3, 3.8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, 5, 8.5, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  }
  ctx.restore();

  if (frozenTimer > 0) {
    ctx.save(); ctx.fillStyle = 'rgba(103, 232, 249, 0.42)'; ctx.strokeStyle = '#cffafe'; ctx.lineWidth = 3;
    ctx.fillRect(dummy.chest.x - 50, dummy.head.y - 34, 100, 150); ctx.strokeRect(dummy.chest.x - 50, dummy.head.y - 34, 100, 150);
    ctx.restore();
  }
}

function drawEffects() {
  // Smuga za palcem (Swipe Trail)
  if (swipeTrail.length > 1) {
    for (let i = 1; i < swipeTrail.length; i++) {
      const a = swipeTrail[i - 1], b = swipeTrail[i];
      ctx.strokeStyle = `rgba(250, 204, 21, ${b.life * 0.65})`;
      ctx.lineWidth = b.life * 8; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
  }
  beams.forEach(bm => {
    ctx.save(); ctx.globalAlpha = bm.life;
    ctx.fillStyle = 'rgba(56, 189, 248, 0.45)'; ctx.fillRect(bm.x - 45, 0, 90, height);
    ctx.fillStyle = '#fff'; ctx.fillRect(bm.x - 16, 0, 32, height); ctx.restore();
  });
  if (pinata) {
    ctx.save(); ctx.translate(pinata.x, pinata.y); ctx.font = '46px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🪅', 0, 0); ctx.font = '900 11px sans-serif'; ctx.fillStyle = '#fde047'; ctx.fillText(`TAP! (${pinata.hp})`, 0, -32); ctx.restore();
  }
  if (goldDrone) {
    ctx.save(); ctx.translate(goldDrone.x, goldDrone.y); ctx.font = '44px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🚁', 0, 0); ctx.font = '900 11px sans-serif'; ctx.fillStyle = '#4ade80'; ctx.fillText('ZŁAP MNIE!', 0, -30); ctx.restore();
  }
  if (meteorShower) {
    ctx.font = '32px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    meteorShower.forEach(m => ctx.fillText('💰', m.x, m.y));
  }
  shockwaves.forEach(sw => {
    ctx.save(); ctx.globalAlpha = Math.max(0, sw.life); ctx.strokeStyle = sw.color; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  });
  blackHoles.forEach(bh => {
    ctx.save(); ctx.translate(bh.x, bh.y); ctx.rotate(bh.angle);
    const grad = ctx.createRadialGradient(0, 0, 5, 0, 0, 68);
    grad.addColorStop(0, '#000'); grad.addColorStop(0.5, '#581c87'); grad.addColorStop(1, 'rgba(147, 51, 234, 0)');
    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(0, 0, 68, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#d8b4fe'; ctx.lineWidth = 3;
    for (let arm = 0; arm < 3; arm++) { ctx.rotate((Math.PI * 2) / 3); ctx.beginPath(); ctx.arc(15, 0, 24, 0, Math.PI); ctx.stroke(); }
    ctx.restore();
  });
  anvils.forEach(av => {
    ctx.save(); ctx.translate(av.x, av.y); ctx.fillStyle = '#334155'; ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2;
    ctx.fillRect(-28, -16, 56, 32); ctx.strokeRect(-28, -16, 56, 32);
    ctx.fillStyle = '#fff'; ctx.font = '900 13px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('100T', 0, 5); ctx.restore();
  });
  ctx.font = '30px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  rockets.forEach(rk => ctx.fillText('🚀', rk.x, rk.y));
  const curW = getWeaponData(currentWeapon);
  if (pointer.down && curW.act === 'hold_laser') {
    const sx = width * 0.5, sy = height - 58;
    ctx.strokeStyle = 'rgba(239, 68, 68, 0.45)'; ctx.lineWidth = 16; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(pointer.x, pointer.y); ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(pointer.x, pointer.y); ctx.stroke();
  }
  if (pointer.down && curW.act === 'hold_saw') {
    ctx.font = '38px sans-serif'; ctx.fillText('🪚', pointer.x + (Math.random() - 0.5) * 6, pointer.y + (Math.random() - 0.5) * 6);
  }
  if (batSwing) { ctx.font = '46px sans-serif'; ctx.fillText(batSwing.icon || '🏏', batSwing.x, batSwing.y); }
  tracers.forEach(t => {
    ctx.strokeStyle = t.col || '#fef08a'; ctx.globalAlpha = Math.max(0, t.life); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(t.x1, t.y1); ctx.lineTo(t.x2, t.y2); ctx.stroke();
  });
  ctx.globalAlpha = 1.0;
  lightnings.forEach(l => {
    ctx.strokeStyle = `rgba(125, 211, 252, ${l.life})`; ctx.lineWidth = 8;
    ctx.beginPath(); l.segments.forEach(s => { ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); }); ctx.stroke();
    ctx.strokeStyle = `rgba(255, 255, 255, ${l.life})`; ctx.lineWidth = 3; ctx.stroke();
  });
  ctx.font = '22px sans-serif'; bees.forEach(b => ctx.fillText('🐝', b.x, b.y));
  ctx.font = '62px sans-serif';
  animals.forEach(a => { ctx.save(); ctx.translate(a.x, a.y); if (a.dir > 0) ctx.scale(-1, 1); ctx.fillText(a.icon, 0, 0); ctx.restore(); });
  particles.forEach(pt => {
    ctx.globalAlpha = Math.max(0, pt.life); ctx.fillStyle = pt.color;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalAlpha = 1.0;
  floatingTexts.forEach(ft => {
    ctx.globalAlpha = Math.max(0, ft.life);
    ctx.font = `900 ${Math.round(17 * ft.scale)}px 'Trebuchet MS', sans-serif`; ctx.textAlign = 'center';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 4; ctx.strokeText(ft.text, ft.x, ft.y);
    ctx.fillStyle = ft.color; ctx.fillText(ft.text, ft.x, ft.y);
  });
  ctx.globalAlpha = 1.0;
  if (flashAlpha > 0) { ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`; ctx.fillRect(0, 0, width, height); }
}

function loop() {
  try {
    update();
    ctx.save();
    if (screenShake > 0.5) ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
    ctx.clearRect(-20, -20, width + 40, height + 40);
    drawArena(); drawDummy(); drawEffects();
    ctx.restore();
  } catch (e) {}
  requestAnimationFrame(loop);
}

loadSave(); resize(); initDummy(); loop();
</script>
